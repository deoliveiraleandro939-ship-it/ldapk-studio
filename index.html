<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LDAPK Studio - Novo endereço</title>

    <meta name="description"
          content="O site oficial da LDAPK Studio mudou para um novo endereço.">

    <!-- Informa aos mecanismos de busca qual é o novo endereço oficial -->
    <link rel="canonical"
          href="https://ldapk-studio.ldapk.workers.dev/">

    <!-- Não queremos que esta página antiga continue nos resultados -->
    <meta name="robots"
          content="noindex, follow">

    <!-- Redirecionamento automático -->
    <meta http-equiv="refresh"
          content="0; url=https://ldapk-studio.ldapk.workers.dev/">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #080b14;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 620px;
            padding: 40px 25px;
            border: 1px solid #25304d;
            border-radius: 20px;
            background: #101625;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 32px;
        }

        p {
            color: #c7ccda;
            font-size: 17px;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 14px 24px;
            border-radius: 10px;
            background: #ffffff;
            color: #080b14;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>LDAPK Studio</h1>

        <p>
            Nosso site mudou para um novo endereço.
        </p>

        <p>
            Você será redirecionado automaticamente para
            o novo site oficial da LDAPK Studio.
        </p>

        <a href="https://ldapk-studio.ldapk.workers.dev/">
            Acessar novo site
        </a>

    </main>

    <script>
        window.location.replace(
            "https://ldapk-studio.ldapk.workers.dev/"
        );
    </script>

</body>
</html>
